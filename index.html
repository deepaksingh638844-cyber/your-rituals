<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b8cff">
<title>Your Rituals — by Satyam</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#151a24;--muted:#7a8497;--primary:#5b8cff;--primary2:#7b61ff;--border:#e7ebf2;--soft:#eef3ff;--danger:#ef4444;--shadow:0 10px 30px #26354d0d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
body.dark{--bg:#0d1218;--card:#171e27;--text:#f4f7fb;--muted:#98a5b6;--border:#293340;--soft:#1d2938;--shadow:0 12px 35px #0005}
body.green{--primary:#18a974;--primary2:#31c88c;--soft:#e9faf3}body.purple{--primary:#7957e8;--primary2:#a46bff;--soft:#f0ebff}
button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:720px;margin:auto;padding-bottom:100px}
header{position:sticky;top:0;z-index:5;padding:19px 17px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.head{display:flex;justify-content:space-between;gap:10px}.brand{font-size:25px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--primary)}
.sub{font-size:12px;color:var(--muted);margin-top:2px}.creator{font-size:11px;color:var(--primary);font-weight:800;margin-top:4px}.clock{text-align:right}.clock b{font-size:16px}.clock span{display:block;font-size:11px;color:var(--muted)}
main{padding:15px}.card{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;border:0}.hero .muted{color:#edf2ff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.big{font-size:38px;font-weight:900}
.progress{height:10px;background:#ffffff45;border-radius:20px;margin:13px 0 8px;overflow:hidden}.progress i{display:block;height:100%;background:white;border-radius:20px;transition:.35s}
.btn{background:var(--primary);color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.btn.secondary{background:var(--soft);color:var(--text);box-shadow:none}.btn.danger{background:#fee2e2;color:#b91c1c}
.title{font-size:18px;font-weight:900;margin:20px 2px 10px}.habit{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--border)}.habit:last-child{border:0}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:17px;flex:none}.check.done{background:var(--primary);border-color:var(--primary);color:white}
.hinfo{flex:1;min-width:0}.hname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hmeta,.hwhy{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-size:11px;color:var(--primary);font-weight:900;white-space:nowrap}.badge{display:inline-block;background:var(--soft);color:var(--primary);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--soft);border-radius:10px;min-height:47px;padding:7px 2px;text-align:center;font-size:11px;cursor:pointer}.day.done{background:color-mix(in srgb,var(--primary) 25%,var(--soft))}.day.today{outline:2px solid var(--primary);font-weight:900}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);border-radius:16px;padding:15px}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:30px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:180px;background:none;color:var(--muted);padding:9px 4px 8px;font-size:11px;font-weight:700}nav button.active{color:var(--primary);font-weight:900}.ni{font-size:19px;line-height:20px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}.footer b{color:var(--primary)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:var(--card);border-radius:25px 25px 0 0;padding:21px;max-height:92vh;overflow:auto}.sheet h2{margin:0}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);margin:6px 0 13px;outline:none}input:focus,select:focus{border-color:var(--primary)}label{font-size:12px;font-weight:800}.actions{display:flex;gap:8px}.actions .btn{flex:1}
.toast{position:fixed;top:17px;left:50%;transform:translateX(-50%);display:none;background:#151923;color:#fff;padding:11px 16px;border-radius:12px;z-index:30;font-size:13px;font-weight:700}
@media(max-width:420px){main{padding:12px}.brand{font-size:23px}.big{font-size:34px}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><div><div class="brand">Your <span>Rituals</span></div><div class="sub">A simple system for building consistency.</div><div class="creator">Powered by Satyam</div></div><div class="clock"><b id="clock">--:--</b><span id="date"></span></div></div></header>
<main id="app"></main>
</div>
<nav>
<button data-tab="today"><div class="ni">⌂</div>Today</button>
<button data-tab="calendar"><div class="ni">▦</div>Calendar</button>
<button data-tab="stats"><div class="ni">◒</div>Stats</button>
<button data-tab="settings"><div class="ni">⚙</div>Settings</button>
</nav>
<div class="modal" id="modal"><div class="sheet">
<div class="row"><h2 id="modalTitle">Add Ritual</h2><button class="btn secondary" onclick="closeModal()">✕</button></div>
<div class="footer" style="text-align:left;padding-left:0">Powered by <b>Satyam</b></div>
<form id="habitForm">
<label>Ritual name</label><input id="habitName" required placeholder="e.g. Read 20 minutes">
<label>Why / description</label><input id="habitWhy" placeholder="Why is this important?">
<label>Emoji</label><input id="habitEmoji" value="✨" maxlength="2">
<label>Category</label><select id="habitCategory"><option>Health</option><option>Study</option><option>Work</option><option>Mind</option><option>Fitness</option><option>Other</option></select>
<label>Reminder time (optional)</label><input id="habitTime" type="time">
<div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save ritual</button></div>
</form></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY="your-rituals-v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{habits:[],history:{},theme:"",tab:"today"},editId=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function completed(id,d=today()){return !!state.history[d]?.includes(id)}
function toggle(id){let d=today();if(!state.history[d])state.history[d]=[];let a=state.history[d],i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);save();render();toast(i>=0?"Ritual unchecked":"Ritual completed ✓")}
function streak(id){let n=0,d=new Date();while(true){let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;if(completed(id,k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function best(id){let ds=Object.keys(state.history).filter(d=>state.history[d].includes(id)).sort(),b=0,c=0,p=null;ds.forEach(d=>{let diff=p?(new Date(d+"T12:00:00")-new Date(p+"T12:00:00"))/86400000:1;c=p&&diff===1?c+1:1;b=Math.max(b,c);p=d});return b}
function toast(x){let t=$("toast");t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",1800)}
function foot(){return `<div class="footer">Powered by <b>Satyam</b></div>`}
function render(){document.body.className=state.theme||"";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===(state.tab||"today")));({today:renderToday,calendar:renderCalendar,stats:renderStats,settings:renderSettings}[state.tab||"today"])()}
function renderToday(){
 let d=today(),done=state.habits.filter(h=>completed(h.id,d)).length,total=state.habits.length,pct=total?Math.round(done/total*100):0;
 $("app").innerHTML=`<div class="card hero"><div class="row"><div><div class="muted">Today's progress</div><div class="big">${pct}%</div></div><div style="font-size:38px">${pct===100?"🏆":"🔥"}</div></div><div class="progress"><i style="width:${pct}%"></i></div><b style="font-size:12px">${done} of ${total} rituals completed</b></div>
 <div class="row title"><span>Today's Rituals</span><button class="btn" onclick="openAdd()">＋ Add</button></div>
 <div class="card">${state.habits.length?state.habits.map(h=>`<div class="habit"><button class="check ${completed(h.id)?"done":""}" onclick="toggle('${h.id}')">${completed(h.id)?"✓":""}</button><div class="hinfo" onclick="editHabit('${h.id}')"><div class="hname">${esc(h.emoji)} ${esc(h.name)}</div><div class="hmeta">${esc(h.category)} · ${h.time?esc(h.time)+" · ":""}🔥 ${streak(h.id)} day streak</div>${h.why?`<div class="hwhy">${esc(h.why)}</div>`:""}</div><button class="btn secondary" onclick="editHabit('${h.id}')">•••</button></div>`).join(""):`<div class="empty">✨<br><b>No rituals yet</b><br>Add your first ritual and start building consistency.</div>`}</div>
 <div class="card"><b>${pct===100?"You showed up today. 🏆":"Today's thought"}</b><p class="muted">${pct===100?"Every completed ritual is a vote for the person you want to become.":"Small actions repeated consistently become a life."}</p></div>${foot()}`
}
function renderCalendar(){
 let n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),c=["S","M","T","W","T","F","S"].map(x=>`<div class="muted" style="text-align:center;font-size:10px;font-weight:800">${x}</div>`).join("");
 for(let i=0;i<first;i++)c+="<div></div>";
 for(let i=1;i<=days;i++){let k=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`,t=state.habits.length,z=(state.history[k]||[]).length,cl=z&&z===t&&t?"done ":"";if(k===today())cl+="today";c+=`<div class="day ${cl}" onclick="showDay('${k}')">${i}<br><small>${t?Math.round(z/t*100):0}%</small></div>`}
 $("app").innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Calendar</h2><span class="badge">${n.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span></div><div style="height:15px"></div><div class="grid">${c}</div></div><div class="card"><b>Consistency calendar</b><p class="muted">Tap any date to see completed rituals.</p></div>${foot()}`
}
function showDay(d){let names=(state.history[d]||[]).map(id=>state.habits.find(h=>h.id===id)?.name).filter(Boolean);alert(d+"\n\n"+(names.length?names.map(x=>"✓ "+x).join("\n"):"No completed rituals"))}
function renderStats(){
 let total=Object.values(state.history).reduce((a,x)=>a+x.length,0),b=state.habits.reduce((a,h)=>Math.max(a,best(h.id)),0),td=state.habits.filter(h=>completed(h.id)).length,rate=state.habits.length?Math.round(td/state.habits.length*100):0;
 $("app").innerHTML=`<h2 style="margin:5px 2px 13px">Your Statistics</h2><div class="stats"><div class="stat"><b>${total}</b><span>Total completions</span></div><div class="stat"><b>${b}</b><span>Best streak</span></div><div class="stat"><b>${rate}%</b><span>Today's consistency</span></div><div class="stat"><b>${state.habits.length}</b><span>Active rituals</span></div></div><div class="card"><h3 style="margin-top:0">🔥 Ritual streaks</h3>${state.habits.length?state.habits.map(h=>`<div class="row" style="padding:11px 0;border-bottom:1px solid var(--border)"><span>${esc(h.emoji)} ${esc(h.name)}</span><span class="streak">${streak(h.id)} 🔥</span></div>`).join(""):"<p class='muted'>Add rituals to see statistics.</p>"}</div>${foot()}`
}
function renderSettings(){
 $("app").innerHTML=`<h2 style="margin:5px 2px 13px">Settings</h2><div class="card"><h3 style="margin-top:0">Appearance</h3><div class="actions"><button class="btn secondary" onclick="setTheme('')">🌤️ Sky</button><button class="btn secondary" onclick="setTheme('dark')">🌙 Dark</button><button class="btn secondary" onclick="setTheme('green')">🌿 Green</button><button class="btn secondary" onclick="setTheme('purple')">💜 Purple</button></div></div>
 <div class="card"><h3 style="margin-top:0">💾 Backup & Restore</h3><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn secondary" onclick="$('importFile').click()">Import JSON</button></div><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div>
 <div class="card"><h3 style="margin-top:0">🔔 Notifications</h3><button class="btn" onclick="requestNotify()">Enable notifications</button><p class="muted" style="font-size:12px">Browser support depends on your device and browser.</p></div>
 <div class="card"><h3 style="margin-top:0">About</h3><p><b>Your Rituals</b><br><span class="muted">A simple system for building consistency.</span></p><span class="badge">Powered by Satyam</span><p class="muted" style="font-size:11px">Local-first · Your data stays in this browser for now.</p></div>
 <div class="card"><button class="btn danger" onclick="resetData()">Reset all data</button></div>${foot()}`
}
function openAdd(){editId=null;$("modalTitle").textContent="Add Ritual";$("habitForm").reset();$("habitEmoji").value="✨";$("modal").classList.add("show")}
function editHabit(id){let h=state.habits.find(x=>x.id===id);if(!h)return;editId=id;$("habitName").value=h.name;$("habitWhy").value=h.why||"";$("habitEmoji").value=h.emoji||"✨";$("habitCategory").value=h.category||"Other";$("habitTime").value=h.time||"";$("modalTitle").textContent="Edit Ritual";$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
$("habitForm").onsubmit=e=>{e.preventDefault();let h={id:editId||crypto.randomUUID(),name:$("habitName").value.trim(),why:$("habitWhy").value.trim(),emoji:$("habitEmoji").value||"✨",category:$("habitCategory").value,time:$("habitTime").value};if(editId){let i=state.habits.findIndex(x=>x.id===editId);state.habits[i]=h}else state.habits.push(h);save();closeModal();render();toast("Ritual saved ✓")}
function setTheme(t){state.theme=t;save();render()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="your-rituals-backup.json";a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.habits||!x.history)throw 0;state=x;save();render();toast("Backup restored ✓")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
function resetData(){if(confirm("Delete all rituals and history? This cannot be undone.")){localStorage.removeItem(KEY);location.reload()}}
async function requestNotify(){if(!("Notification"in window)){alert("Notifications are not supported here.");return}let p=await Notification.requestPermission();alert(p==="granted"?"Notifications enabled ✓":"Permission not granted.")}
function updateClock(){let n=new Date();$("clock").textContent=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});$("date").textContent=n.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});updateClock();setInterval(updateClock,1000);render();
</script>
</body>
</html>
