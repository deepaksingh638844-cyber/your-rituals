<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b7cff">
<title>Your Rituals · Powered by Satyam</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#f0f3fa;--text:#111827;
  --muted:#697386;--primary:#5b7cff;--primary2:#7c5cff;
  --line:#e5e9f2;--success:#20b486;--danger:#ef4444;
  --shadow:0 12px 35px rgba(31,41,55,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;padding-bottom:104px}
header{
  position:sticky;top:0;z-index:20;padding:18px 18px 15px;
  background:rgba(245,247,251,.88);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(229,233,242,.8);
}
.headerTop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand{font-size:29px;font-weight:900;letter-spacing:-1.2px}
.brand span{color:var(--primary)}
.subtitle{margin-top:3px;color:var(--muted);font-size:13px}
.powered{margin-top:7px;color:var(--primary);font-size:12px;font-weight:800}
.clock{text-align:right;white-space:nowrap}
.clock b{display:block;font-size:18px}.clock span{color:var(--muted);font-size:12px}
main{padding:18px 16px}
.pageTitle{font-size:28px;line-height:1.1;margin:4px 0 16px;letter-spacing:-.7px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 12px}
.sectionHead h2{font-size:21px;margin:0;letter-spacing:-.4px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:24px;
  padding:18px;margin-bottom:15px;box-shadow:var(--shadow);
}
.hero{
  color:white;border:0;overflow:hidden;padding:22px;
  background:linear-gradient(135deg,#4f8cff 0%,#625cff 55%,#805cff 100%);
  box-shadow:0 18px 40px rgba(91,124,255,.24);
}
.hero .muted{color:rgba(255,255,255,.78)}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:16px}
.heroLabel{font-size:14px;font-weight:700;opacity:.9}
.big{font-size:48px;line-height:1;font-weight:900;letter-spacing:-2px;margin-top:5px}
.heroFire{font-size:52px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15))}
.progress{height:11px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin:20px 0 10px}
.progress i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s ease}
.heroBottom{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.btn{
  background:var(--primary);color:#fff;padding:12px 16px;border-radius:14px;
  font-weight:800;box-shadow:0 7px 18px rgba(91,124,255,.2);transition:.15s;
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--surface2);color:var(--text);box-shadow:none}
.btn.danger{background:#fee2e2;color:#b91c1c;box-shadow:none}
.btn.small{padding:9px 12px;border-radius:12px;font-size:13px}
.addBtn{padding:13px 17px}
.habitList{padding:6px 18px}
.habit{
  display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line);
}
.habit:last-child{border-bottom:0}
.check{
  flex:0 0 38px;width:38px;height:38px;border-radius:50%;
  border:2px solid #e2e7f0;background:var(--surface);font-size:19px;
  transition:.18s;
}
.check.done{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(91,124,255,.25)}
.hinfo{flex:1;min-width:0;cursor:pointer}
.hname{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.hmeta{font-size:12px;color:var(--muted);margin-top:4px}
.more{width:40px;height:40px;border-radius:13px;background:var(--surface2);font-size:18px}
.empty{text-align:center;padding:35px 16px;color:var(--muted)}
.emptyIcon{font-size:38px;margin-bottom:8px}
.thought p{margin:8px 0 0;font-size:15px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.weekHead{font-size:11px;text-align:center;color:var(--muted);font-weight:800}
.day{
  min-height:53px;padding:8px 2px;text-align:center;border-radius:13px;
  background:var(--surface2);font-size:13px;cursor:pointer;border:1px solid transparent;
}
.day small{font-size:10px;color:var(--muted)}
.day.done{background:#dff8ef;border-color:#b8eedc}.day.today{outline:2px solid var(--primary);outline-offset:1px}
.day.today.done{background:#dff8ef}
.monthPill{background:#edf1ff;color:var(--primary);padding:8px 12px;border-radius:99px;font-size:12px;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:17px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat b{font-size:29px;display:block;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}
.statIcon{font-size:20px;margin-bottom:5px}
.streakRow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.streakRow:last-child{border-bottom:0}
.streakName{font-weight:750}
.streakValue{color:var(--primary);font-weight:900}
.settingGroup{margin-bottom:15px}
.settingGroup h3{margin:0 0 12px;font-size:17px}
.themeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themeBtn{background:var(--surface2);padding:13px 6px;border-radius:15px;font-weight:800;color:var(--text)}
.themeBtn.active{outline:2px solid var(--primary);color:var(--primary)}
.aboutBrand{display:flex;align-items:center;gap:12px}
.logoMark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#5b7cff,#805cff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px}
.smallText{font-size:12px;color:var(--muted);line-height:1.5}
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;justify-content:center;background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:max(7px,env(safe-area-inset-bottom));
}
nav button{
  flex:1;max-width:190px;background:none;color:#7a8494;padding:10px 4px 7px;
  font-size:11px;font-weight:700;
}
nav button .navIcon{font-size:21px;display:block;line-height:22px;margin-bottom:3px}
nav button.active{color:var(--primary)}
.navDot{display:block;width:4px;height:4px;background:currentColor;border-radius:50%;margin:3px auto 0;opacity:0}
nav button.active .navDot{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;z-index:50;padding:0}
.modal.show{display:flex}
.sheet{
  width:100%;max-width:760px;margin:auto;background:var(--surface);
  border-radius:28px 28px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;box-shadow:0 -20px 60px rgba(0,0,0,.18)
}
.sheetHandle{width:42px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 18px}
.modalTitle{font-size:23px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
label{font-size:12px;font-weight:800;display:block;margin:14px 0 5px}
input,select{
  width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;
  background:var(--surface);color:var(--text);outline:none;
}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,124,255,.1)}
.formActions{display:flex;gap:9px;margin-top:18px}.formActions>*{flex:1}
.deleteBtn{width:100%;margin-top:10px}
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  background:#111827;color:#fff;padding:11px 16px;border-radius:13px;
  display:none;z-index:80;font-size:13px;font-weight:700;box-shadow:0 10px 30px #0003;
}
.footerBrand{text-align:center;color:#8a93a3;font-size:12px;margin:25px 0 5px}
.footerBrand b{color:var(--primary)}
body.dark{
  --bg:#0d1219;--surface:#151d27;--surface2:#202a36;--text:#f3f6fa;
  --muted:#9aa8b8;--line:#293543;--shadow:0 12px 35px rgba(0,0,0,.22)
}
body.green{--primary:#20b486;--primary2:#16a67a}
body.purple{--primary:#8b5cf6;--primary2:#7c3aed}
@media(max-width:420px){
  main{padding:15px 12px}.card{border-radius:21px}.hero{padding:19px}
  .big{font-size:43px}.brand{font-size:27px}.statgrid{gap:9px}.stat{padding:14px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="headerTop">
    <div>
      <div class="brand">Your <span>Rituals</span></div>
      <div class="subtitle">A simple system for building consistency.</div>
      <div class="powered">Powered by Satyam</div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="date">--</span></div>
  </div>
</header>
<main id="app"></main>
</div>

<nav>
  <button data-tab="today"><span class="navIcon">⌂</span>Today<span class="navDot"></span></button>
  <button data-tab="calendar"><span class="navIcon">▦</span>Calendar<span class="navDot"></span></button>
  <button data-tab="stats"><span class="navIcon">◒</span>Stats<span class="navDot"></span></button>
  <button data-tab="settings"><span class="navIcon">⚙</span>Settings<span class="navDot"></span></button>
</nav>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheetHandle"></div>
    <div class="row">
      <h2 class="modalTitle" id="modalTitle">Add Ritual</h2>
      <button class="btn secondary small" id="closeModalBtn">✕</button>
    </div>
    <form id="habitForm">
      <label for="habitName">Ritual name</label>
      <input id="habitName" required maxlength="60" placeholder="e.g. Read 20 minutes">

      <label for="habitWhy">Why / description</label>
      <input id="habitWhy" maxlength="120" placeholder="Why is this important?">

      <label for="habitEmoji">Emoji</label>
      <input id="habitEmoji" value="✨" maxlength="2">

      <label for="habitCategory">Category</label>
      <select id="habitCategory">
        <option>Health</option><option>Study</option><option>Work</option>
        <option>Mind</option><option>Fitness</option><option>Other</option>
      </select>

      <label for="habitTime">Reminder time (optional)</label>
      <input id="habitTime" type="time">

      <div class="formActions">
        <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
        <button class="btn" type="submit">Save ritual</button>
      </div>
      <button type="button" class="btn danger deleteBtn" id="deleteBtn" style="display:none">Delete ritual</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="your-rituals-v2";

const $=id=>document.getElementById(id);
const defaultState={habits:[],history:{},theme:"",tab:"today"};

let state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")||defaultState}
catch{state=defaultState}
if(!Array.isArray(state.habits))state.habits=[];
if(!state.history||typeof state.history!=="object")state.history={};

let editId=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function localDateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseDateKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(k){
  return parseDateKey(k).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
function escapeHTML(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function completed(id,k=localDateKey()){return !!state.history[k]?.includes(id)}
function toggle(id,k=localDateKey()){
  if(!state.history[k])state.history[k]=[];
  const a=state.history[k],i=a.indexOf(id);
  if(i>=0)a.splice(i,1);else a.push(id);
  save();render();
}
function streak(id){
  let n=0,d=new Date();
  while(completed(id,localDateKey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function bestStreak(id){
  const dates=Object.keys(state.history).filter(k=>state.history[k]?.includes(id)).sort();
  let best=0,cur=0,prev=null;
  for(const k of dates){
    if(prev){
      const diff=(parseDateKey(k)-parseDateKey(prev))/86400000;
      cur=diff===1?cur+1:1;
    }else cur=1;
    best=Math.max(best,cur);prev=k;
  }
  return best;
}
function toast(msg){
  const t=$("toast");t.textContent=msg;t.style.display="block";
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",1800);
}
function footer(){
  return `<div class="footerBrand">Powered by <b>Satyam</b></div>`;
}
function render(){
  document.body.className=state.theme||"";
  const tab=state.tab||"today";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  if(tab==="today")renderToday();
  else if(tab==="calendar")renderCalendar();
  else if(tab==="stats")renderStats();
  else renderSettings();
}
function renderToday(){
  const d=localDateKey(),total=state.habits.length,done=state.habits.filter(h=>completed(h.id,d)).length;
  const pct=total?Math.round(done/total*100):0;
  $("app").innerHTML=`
    <div class="card hero">
      <div class="heroRow">
        <div><div class="heroLabel">TODAY'S PROGRESS</div><div class="big">${pct}%</div></div>
        <div class="heroFire">🔥</div>
      </div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="heroBottom"><span>${done} of ${total} rituals completed</span><span>${pct===100&&total?"Complete ✓":"Keep going"}</span></div>
    </div>

    <div class="sectionHead">
      <h2>Today's Rituals</h2>
      <button class="btn addBtn" onclick="openAdd()">＋ Add</button>
    </div>

    <div class="card habitList">
      ${state.habits.length?state.habits.map(h=>`
        <div class="habit">
          <button class="check ${completed(h.id,d)?"done":""}" onclick="toggle('${h.id}')">${completed(h.id,d)?"✓":""}</button>
          <div class="hinfo" onclick="editHabit('${h.id}')">
            <div class="hname">${escapeHTML(h.emoji||"✨")} ${escapeHTML(h.name)}</div>
            <div class="hmeta">${escapeHTML(h.category||"Other")} · 🔥 ${streak(h.id)} day streak${h.time?" · ⏰ "+escapeHTML(h.time):""}</div>
          </div>
          <button class="more" onclick="editHabit('${h.id}')">•••</button>
        </div>`).join("")
        :`<div class="empty"><div class="emptyIcon">✨</div><b>No rituals yet</b><br>Add your first ritual and start building consistency.</div>`}
    </div>

    <div class="card thought">
      <b>Today's thought</b>
      <p class="muted">${pct===100&&total?"Everything is done. Excellent consistency.":"Small actions repeated consistently become a life."}</p>
    </div>
    ${footer()}`;
}
function renderCalendar(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let cells=["S","M","T","W","T","F","S"].map(x=>`<div class="weekHead">${x}</div>`).join("");
  for(let i=0;i<first;i++)cells+="<div></div>";
  for(let n=1;n<=days;n++){
    const k=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
    const total=state.habits.length,done=(state.history[k]||[]).filter(id=>state.habits.some(h=>h.id===id)).length;
    const pct=total?Math.round(done/total*100):0;
    const cls=(pct===100&&total?"done ":"")+(k===localDateKey()?"today":"");
    cells+=`<div class="day ${cls}" onclick="showDay('${k}')"><b>${n}</b><br><small>${pct}%</small></div>`;
  }
  $("app").innerHTML=`
    <div class="sectionHead"><h2>Calendar</h2><span class="monthPill">${now.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span></div>
    <div class="card"><div class="grid">${cells}</div></div>
    <div class="card"><b>Consistency calendar</b><p class="muted">Tap any date to see completed rituals.</p></div>
    ${footer()}`;
}
function showDay(k){
  const ids=state.history[k]||[];
  const names=ids.map(id=>state.habits.find(h=>h.id===id)?.name).filter(Boolean);
  alert(fmt(k)+"\n\n"+(names.length?names.map(x=>"✓ "+x).join("\n"):"No completed rituals"));
}
function renderStats(){
  let total=0;Object.values(state.history).forEach(a=>total+=Array.isArray(a)?a.length:0);
  const best=state.habits.reduce((x,h)=>Math.max(x,bestStreak(h.id)),0);
  const todayDone=state.habits.filter(h=>completed(h.id)).length;
  const rate=state.habits.length?Math.round(todayDone/state.habits.length*100):0;
  $("app").innerHTML=`
    <h1 class="pageTitle">Your Statistics</h1>
    <div class="statgrid">
      <div class="stat"><div class="statIcon">✓</div><b>${total}</b><span>Total completions</span></div>
      <div class="stat"><div class="statIcon">🔥</div><b>${best}</b><span>Best streak</span></div>
      <div class="stat"><div class="statIcon">◒</div><b>${rate}%</b><span>Today's consistency</span></div>
      <div class="stat"><div class="statIcon">✨</div><b>${state.habits.length}</b><span>Active rituals</span></div>
    </div>
    <div class="sectionHead"><h2>🔥 Ritual streaks</h2></div>
    <div class="card">
      ${state.habits.length?state.habits.map(h=>`
        <div class="streakRow"><span class="streakName">${escapeHTML(h.emoji||"✨")} ${escapeHTML(h.name)}</span><span class="streakValue">${streak(h.id)} 🔥</span></div>
      `).join(""):"<div class='empty'>Add rituals to see your statistics.</div>"}
    </div>
    ${footer()}`;
}
function renderSettings(){
  $("app").innerHTML=`
    <h1 class="pageTitle">Settings</h1>
    <div class="card settingGroup">
      <h3>Appearance</h3>
      <div class="themeGrid">
        <button class="themeBtn ${state.theme===""?"active":""}" onclick="setTheme('')">☀️<br>Sky</button>
        <button class="themeBtn ${state.theme==="dark"?"active":""}" onclick="setTheme('dark')">🌙<br>Dark</button>
        <button class="themeBtn ${state.theme==="green"?"active":""}" onclick="setTheme('green')">🌿<br>Green</button>
        <button class="themeBtn ${state.theme==="purple"?"active":""}" onclick="setTheme('purple')">💜<br>Purple</button>
      </div>
    </div>

    <div class="card settingGroup">
      <h3>💾 Backup & Restore</h3>
      <div class="row">
        <button class="btn" onclick="exportData()">Export JSON</button>
        <button class="btn secondary" onclick="$('importFile').click()">Import JSON</button>
      </div>
      <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)">
    </div>

    <div class="card settingGroup">
      <h3>🔔 Notifications</h3>
      <button class="btn" onclick="requestNotify()">Enable notifications</button>
      <p class="smallText">This asks your browser for notification permission. It does not send reminders when the page is completely closed.</p>
    </div>

    <div class="card settingGroup">
      <h3>About Your Rituals</h3>
      <div class="aboutBrand">
        <div class="logoMark">S</div>
        <div><b>Your Rituals</b><div class="smallText">A simple system for building consistency.</div></div>
      </div>
      <p class="smallText" style="margin-bottom:0">Local-first · Your ritual data stays in this browser for now.</p>
    </div>

    <div class="card">
      <button class="btn danger" onclick="resetData()">Reset all data</button>
    </div>
    ${footer()}`;
}
function openAdd(){
  editId=null;$("modalTitle").textContent="Add Ritual";$("habitForm").reset();
  $("habitEmoji").value="✨";$("deleteBtn").style.display="none";$("modal").classList.add("show");
  setTimeout(()=>$("habitName").focus(),100);
}
function editHabit(id){
  const h=state.habits.find(x=>x.id===id);if(!h)return;
  editId=id;$("modalTitle").textContent="Edit Ritual";
  $("habitName").value=h.name||"";$("habitWhy").value=h.why||"";
  $("habitEmoji").value=h.emoji||"✨";$("habitCategory").value=h.category||"Other";
  $("habitTime").value=h.time||"";$("deleteBtn").style.display="block";$("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show")}
$("closeModalBtn").onclick=closeModal;$("cancelBtn").onclick=closeModal;
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("habitForm").onsubmit=e=>{
  e.preventDefault();
  const h={id:editId||crypto.randomUUID(),name:$("habitName").value.trim(),why:$("habitWhy").value.trim(),
    emoji:$("habitEmoji").value.trim()||"✨",category:$("habitCategory").value,time:$("habitTime").value};
  if(!h.name)return;
  if(editId){const i=state.habits.findIndex(x=>x.id===editId);if(i>=0)state.habits[i]=h}
  else state.habits.push(h);
  save();closeModal();render();toast(editId?"Ritual updated ✓":"Ritual added ✓");editId=null;
};
$("deleteBtn").onclick=()=>{
  if(!editId)return;
  const h=state.habits.find(x=>x.id===editId);
  if(confirm(`Delete "${h?.name||"this ritual"}"?`)){
    state.habits=state.habits.filter(x=>x.id!==editId);
    Object.keys(state.history).forEach(k=>state.history[k]=state.history[k].filter(id=>id!==editId));
    save();closeModal();render();toast("Ritual deleted");
  }
};
function setTheme(t){state.theme=t;save();render()}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="your-rituals-backup.json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function importData(e){
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!Array.isArray(x.habits)||!x.history)throw new Error();
      state={...defaultState,...x};save();render();toast("Backup restored ✓");
    }catch{alert("Invalid backup file.")}
    e.target.value="";
  };r.readAsText(f);
}
function resetData(){
  if(confirm("Delete all rituals and history? This cannot be undone.")){
    localStorage.removeItem(KEY);location.reload();
  }
}
async function requestNotify(){
  if(!("Notification" in window)){alert("Notifications are not supported in this browser.");return}
  const p=await Notification.requestPermission();
  alert(p==="granted"?"Notifications enabled ✓":"Permission not granted.");
}
function updateClock(){
  const n=new Date();
  $("clock").textContent=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  $("date").textContent=n.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});
updateClock();setInterval(updateClock,1000);render();
</script>
</body>
</html>
